name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Self-check (this repo's own rules against this PR)
        if: github.event_name == 'pull_request'
        env:
          TENNYN_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: go run . check
      - name: Cheat sheet is up to date
        run: go run . cheatsheet --check README.md
      - name: Self-test the action (published release, end to end)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          version: v1.0.1

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.') }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify VERSION matches the tag
        run: |
          [ "$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" ] || { echo "VERSION file ($(cat VERSION)) does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Forgejo release
        env:
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/release.sh forgejo "${GITHUB_REF_NAME}"
      - name: GitHub release (public mirror)
        if: env.GH_RELEASE_TOKEN != ''
        env:
          API: https://api.github.com
          REPO: Ultizan/tennyn
          TOKEN: ${{ env.GH_RELEASE_TOKEN }}
        run: |
          # The tag must exist on GitHub first; push it with the same token.
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "refs/tags/${GITHUB_REF_NAME}"
          sh scripts/release.sh github "${GITHUB_REF_NAME}"
      - name: Move floating major tag
        env:
          TOKEN: ${{ env.GH_RELEASE_TOKEN }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "${GITHUB_REF_NAME}"
          git push -f origin "refs/tags/$major"
          [ -z "$TOKEN" ] || git push -f "https://x-access-token:${TOKEN}@github.com/Ultizan/tennyn.git" "refs/tags/$major"
