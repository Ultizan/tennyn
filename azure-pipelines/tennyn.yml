# Step template. Consume with:
#   resources:
#     repositories:
#       - repository: tennyn
#         type: github          # or git for Azure Repos
#         name: Ultizan/tennyn
#         ref: refs/tags/v1.0.0
#         endpoint: <github service connection>
#   steps:
#     - template: azure-pipelines/tennyn.yml@tennyn
parameters:
  - name: version
    type: string
    default: latest
  - name: config
    type: string
    default: tennyn.yml
  - name: downloadUrl
    type: string
    default: https://github.com/Ultizan/tennyn/releases

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
  - bash: |
      set -euo pipefail
      v="${{ parameters.version }}"
      if [ "$v" = latest ]; then u="${{ parameters.downloadUrl }}/latest/download"; else u="${{ parameters.downloadUrl }}/download/$v"; fi
      curl -fsSL "$u/install.sh" -o "$AGENT_TEMPDIRECTORY/tennyn-install.sh"
      bin="$(TENNYN_DOWNLOAD_URL="${{ parameters.downloadUrl }}" sh "$AGENT_TEMPDIRECTORY/tennyn-install.sh" "$v" | tail -n 1)"
      "$bin" --config "${{ parameters.config }}" check
    displayName: tennyn co-change gate
    condition: eq(variables['Build.Reason'], 'PullRequest')
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
